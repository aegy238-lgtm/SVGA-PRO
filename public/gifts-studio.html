<style>
:root{--bg:#0b0e1a;--sf:#141930;--tx:#eceefa;--mu:#8991b0;--bd:#252c4d;--ac:#8a70ff;--ac2:#b24cff;--er:#e0334f;--ok:#12a36a;--sh:0 8px 30px #0008;--bgv:#141a30;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px "Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;min-height:100vh;user-select:none;-webkit-user-select:none}
button,select,input{font:inherit;color:inherit}
button{border:0;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:9px 14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:.15s}
button:hover{border-color:var(--ac);transform:translateY(-1px)}button:disabled{opacity:.5;pointer-events:none}
button.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;font-weight:600;box-shadow:0 6px 18px #6a4cff44}
button.wm-on{border-color:#a855f7;background:linear-gradient(135deg,rgba(138,112,255,.22),rgba(178,76,255,.22));color:#f3e8ff;box-shadow:0 0 16px rgba(168,85,247,.32)}
select{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:9px 10px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 18px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.brand{display:flex;gap:10px;align-items:center;margin-inline-end:auto}.lg{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-size:20px;font-style:normal}
.brand b{display:block;font-size:16px}.brand small{color:var(--mu)}
.act{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:relative}
.pop{position:absolute;top:110%;inset-inline-start:0;z-index:30;width:290px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--sh);display:none;flex-direction:column;gap:10px}.pop.o{display:flex}
.wmpop{position:absolute;top:110%;inset-inline-start:90px;z-index:31;width:320px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--sh);display:none;flex-direction:column;gap:10px}.wmpop.o{display:flex}
.sw{display:flex;flex-wrap:wrap;gap:8px}.sw i{width:34px;height:34px;border-radius:10px;cursor:pointer;border:2px solid var(--bd)}.sw i:hover{border-color:var(--ac)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 18px;color:var(--mu)}
.bar button{padding:6px 10px;font-size:13px}.bar .sp{margin-inline-end:auto}
#drop{margin:18px;border:2px dashed var(--bd);border-radius:24px;padding:70px 20px;text-align:center;color:var(--mu);background:var(--sf);transition:.2s;position:relative;overflow:hidden}#drop.o{border-color:var(--ac);background:#6a4cff12}
#drop h2{color:var(--tx);margin:8px 0}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--w,200px),1fr));gap:14px;padding:6px 18px 110px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;overflow:hidden;position:relative;box-shadow:var(--sh);cursor:grab;contain:layout style}.card.sel{outline:2px solid var(--ac)}.card.dg{opacity:.4}
.st{aspect-ratio:1;background:var(--bgv);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.st>div{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}.st>div>*{max-width:100%;max-height:100%}
.st canvas:not(.wm-ov){max-width:100%!important;max-height:100%!important;width:100%!important;height:100%!important;object-fit:contain!important;transform:none!important;margin:0!important}
.st canvas.wm-ov{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;pointer-events:none!important;z-index:3!important;object-fit:fill!important}

.meta{padding:9px 12px 4px;font-size:13px}.meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta small{color:var(--mu)}

#dock{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));inset-inline:14px;max-width:560px;margin-inline:auto;background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:12px 14px;box-shadow:var(--sh);display:none;z-index:25}

.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}label{display:inline-flex;gap:6px;align-items:center}

button.wm-on .wm-dot{background:#22c55e;box-shadow:0 0 8px #22c55e}

 </div>

<input type="file" id="fi" multiple hidden><input type="file" id="bfi" accept="image/*" hidden>

 <button id="qExtract" title="استخراج ملفات SVGA في فولدر والملفات الأخرى في فولدر مع صور الهدايا الواضحة" style="border-color:rgba(16,185,129,.45);background:rgba(16,185,129,.12);color:#d1fae5">📦 استخراج الفولدرات + الصور</button>
 <span class="sp"></span>
 <button id="pa">▶ تشغيل الكل</button><button id="sa">⏸ إيقاف الكل</button><button id="ra">🔄 إعادة الكل</button>
 <button id="muBtn" class="pill" style="border:1px solid var(--ac);background:#20183b;color:#f3e8ff;display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:6px 12px;border-radius:10px" title="كتم أو تشغيل صوت المعاينة">🔇 الصوت: مكتوم (اضغط للتشغيل)</button>
 <input type="checkbox" id="mu" checked hidden>
 <label>الحجم <input type="range" id="zm" min="130" max="420" value="200"></label>
 <label>إطارات <select id="fps"><option>24</option><option selected>30</option><option>60</option></select></label>
 <label>مدة الثابتة <input type="number" id="sd" value="3" min="1" style="width:56px;border:1px solid var(--bd);border-radius:10px;padding:5px;background:var(--sf)"></label>
</div>
<div id="drop"><div style="font-size:46px">📦</div><h2>اسحب الهدايا هنا أو اضغط للرفع</h2><div>SVGA · PAG · VAP · YYEVA · Lottie · MP4 · GIF · APNG · WebP · SVG</div><div style="font-size:12px;opacity:.7;margin-top:6px">لا يتم رفع الصور الثابتة (PNG / JPG)</div><canvas id="dropWm" class="wm-ov" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:none"></canvas></div>
<div id="grid"></div>
<div id="dock"><div class="r"><b id="dt">…</b><span style="margin-inline-start:auto"></span><button id="cx">إلغاء</button><button class="p" id="sv" style="display:none">⬇ حفظ الملف</button></div><div id="pw"><div id="pg"></div></div><small id="ds" style="color:var(--mu)"></small></div>
<script src="/mp4-muxer.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/svgaplayerweb/2.3.1/svga.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s),E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L=u=>new TextDecoder('latin1').decode(u),S=(u,a,b)=>L(u.subarray(a,b)),N=()=>{};
const MIME={svg:'image/svg+xml',mp4:'video/mp4',vap:'video/mp4',gif:'image/gif',png:'image/png',apng:'image/png',webp:'image/webp',webpa:'image/webp',jpg:'image/jpeg'};
const NAMES={svga:'SVGA',lottie:'Lottie',gif:'GIF',apng:'APNG',webpa:'WebP',webp:'WebP',png:'PNG',jpg:'JPG',svg:'SVG',mp4:'MP4',vap:'VAP',pag:'PAG'};
let items=[],nid=1,muted=true,playing=true,isExporting=false,players=new Map(),sig={stop:false},out=null,dl=null,dragId=0;
const bg={mode:'color',c1:'#141a30',c2:'#4b2f8a',img:null,url:'',fit:'cover'};
const dur=it=>it.dur>0?it.dur:+$('#sd').value||3;

/* إعدادات ورسم العلامة المائية الشبكية الكاملة (مربعات متصلة + خط احترافي + الاسم على حجم الهدية بالكامل) */
const wm={
 enabled:false,
 text:'SVGA PRO Ahmed',
 cols:3,
 opacity:0.38,
 color:'#ffffff',
 accent:'#a855f7'
};
try{
 const savedWm=JSON.parse(localStorage.getItem('gifts_studio_wm_v1')||'null');
 if(savedWm&&typeof savedWm==='object'){
  if(typeof savedWm.enabled==='boolean')wm.enabled=savedWm.enabled;
  if(typeof savedWm.text==='string'&&savedWm.text.trim())wm.text=savedWm.text;
  if(savedWm.cols)wm.cols=+savedWm.cols||3;
  if(savedWm.opacity)wm.opacity=+savedWm.opacity||0.38;
  if(savedWm.color)wm.color=savedWm.color;
  if(savedWm.accent)wm.accent=savedWm.accent;
 }
}catch(e){}

function saveWmState(){
 try{localStorage.setItem('gifts_studio_wm_v1',JSON.stringify(wm))}catch(e){}
}

function drawWatermark(ctx,W,H,forceShow){
 if((!wm.enabled&&!forceShow)||W<=4||H<=4)return;
 const label=(wm.text||'').trim()||'SVGA PRO Ahmed';
 const cols=Math.max(2,Math.min(8,Math.round(wm.cols||3)));
 const cellW=W/cols;
 const rows=Math.max(2,Math.round(H/cellW));
 const cellH=H/rows;
 const alpha=Math.max(0.08,Math.min(0.95,Number(wm.opacity)||0.38));
 const lineScale=Math.max(1,Math.min(W,H)/360);
 const diag=Math.hypot(cellW,cellH);
 const fontSize=Math.max(10,Math.min(64,Math.round(Math.min(cellW*0.21,(diag*0.70)/Math.max(6,label.length*0.58)))));
 const angleRad=-22*Math.PI/180;

 ctx.save();
 ctx.globalAlpha=alpha;

 // 1) رسم شبكة المربعات المتصلة على كامل حجم الهدية
 ctx.strokeStyle=wm.color||'#ffffff';
 ctx.lineWidth=Math.max(1,1.15*lineScale);
 for(let r=0;r<rows;r++){
  for(let c=0;c<cols;c++){
   const x=c*cellW,y=r*cellH;
   ctx.strokeRect(x+0.5,y+0.5,cellW-1,cellH-1);
   const cr=Math.min(cellW,cellH)*0.13;
   ctx.beginPath();
   ctx.moveTo(x+3,y+3+cr);ctx.lineTo(x+3,y+3);ctx.lineTo(x+3+cr,y+3);
   ctx.moveTo(x+cellW-3-cr,y+cellH-3);ctx.lineTo(x+cellW-3,y+cellH-3);ctx.lineTo(x+cellW-3,y+cellH-3-cr);
   ctx.stroke();
  }
 }

 // 2) رسم الخط الاحترافي والاسم داخل كل مربع
 for(let r=0;r<rows;r++){
  for(let c=0;c<cols;c++){
   const cx0=c*cellW+cellW/2,cy0=r*cellH+cellH/2;
   ctx.save();
   ctx.translate(cx0,cy0);

   // خط قطري متقطع خفيف يصل زوايا المربع
   ctx.save();
   ctx.globalAlpha=alpha*0.45;
   ctx.strokeStyle=wm.accent||'#a855f7';
   ctx.lineWidth=Math.max(1,1*lineScale);
   ctx.setLineDash([Math.max(4,5*lineScale),Math.max(3,4*lineScale)]);
   ctx.beginPath();
   ctx.moveTo(-cellW*0.44,cellH*0.44);
   ctx.lineTo(cellW*0.44,-cellH*0.44);
   ctx.stroke();
   ctx.restore();

   ctx.rotate(angleRad);
   ctx.font=`800 ${fontSize}px "Tajawal","Segoe UI",system-ui,sans-serif`;
   ctx.textAlign='center';
   ctx.textBaseline='middle';

   const lineHalfW=Math.min(cellW*0.42,Math.max(fontSize*2.1,cellW*0.35));
   const lineY=fontSize*0.66;

   // خط سفلي وعلوي احترافي يحيط بالاسم داخل المربع
   ctx.beginPath();
   ctx.strokeStyle=wm.accent||'#a855f7';
   ctx.lineWidth=Math.max(1.2,1.5*lineScale);
   ctx.moveTo(-lineHalfW,lineY);
   ctx.lineTo(lineHalfW,lineY);
   ctx.stroke();

   ctx.beginPath();
   ctx.strokeStyle=wm.color||'#ffffff';
   ctx.lineWidth=Math.max(0.9,1.1*lineScale);
   ctx.moveTo(-lineHalfW*0.72,-lineY);
   ctx.lineTo(lineHalfW*0.72,-lineY);
   ctx.stroke();

   // هالة داكنة لضمان وضوح الاسم فوق كل ألوان الهدايا
   ctx.lineJoin='round';
   ctx.lineWidth=Math.max(2.2,fontSize*0.16);
   ctx.strokeStyle='rgba(8,10,22,0.82)';
   ctx.strokeText(label,0,0);

   ctx.fillStyle=wm.color||'#ffffff';
   ctx.fillText(label,0,0);
   ctx.restore();
  }
 }
 ctx.restore();
}

function updateCardWatermarkOverlay(cardEl){
 if(!cardEl)return;
 const st=cardEl.querySelector('.st');
 if(!st)return;
 let ov=st.querySelector('canvas.wm-ov');
 if(!wm.enabled){
  if(ov)ov.style.display='none';
  return;
 }
 if(!ov){
  ov=E('canvas','wm-ov');
  st.append(ov);
 }
 ov.style.display='block';
 const rect=st.getBoundingClientRect();
 const w=Math.max(200,Math.round(rect.width||240));
 const h=Math.max(200,Math.round(rect.height||240));
 if(ov.width!==w||ov.height!==h){ov.width=w;ov.height=h}
 const x=ov.getContext('2d');
 x.clearRect(0,0,w,h);
 drawWatermark(x,w,h,true);
}

function refreshAllWatermarks(){
 $('#wmb').classList.toggle('wm-on',wm.enabled);
 $('#wmen').checked=wm.enabled;
 $('#wmtxt').value=wm.text;
 $('#wmcols').value=String(wm.cols);
 $('#wmop').value=String(Math.round(wm.opacity*100));
 $('#wmopv').textContent=Math.round(wm.opacity*100)+'%';
 $('#wmc1').value=wm.color;
 $('#wmc2').value=wm.accent;

 // تحديث المعاينة داخل نافذة العلامة المائية
 const pvc=$('#wmpvc');
 if(pvc){
  const pvx=pvc.getContext('2d');
  pvx.clearRect(0,0,pvc.width,pvc.height);
  drawBg(pvx,pvc.width,pvc.height);
  drawWatermark(pvx,pvc.width,pvc.height,true);
 }

 // تحديث منطقة السحب عند عدم وجود ملفات
 const dropWm=$('#dropWm');
 if(dropWm){
  if(wm.enabled){
   dropWm.style.display='block';
   const r=$('#drop').getBoundingClientRect();
   const dw=Math.max(320,Math.round(r.width||640)),dh=Math.max(180,Math.round(r.height||240));

function isAudioBytesHeader(b){
 if(!b||b.length<4)return false;
 // ID3 tag, MP3 frame sync, RIFF WAV, Ogg, or ftyp/ADTS
 if(b[0]===0x49&&b[1]===0x44&&b[2]===0x33)return true;
 if(b[0]===0xFF&&(b[1]&0xE0)===0xE0)return true;
 if(b[0]===0x52&&b[1]===0x49&&b[2]===0x46&&b[3]===0x46)return true;
 if(b[0]===0x4F&&b[1]===0x67&&b[2]===0x67&&b[3]===0x53)return true;
 return false;
}

async function extractSvgaAudioBytes(it,rawU8){
 if(it&&it._audioBytes)return it._audioBytes;
 // 1. Check parsed svgaItem.images / svgaItem.audios first
 const v=it&&it.svgaItem;
 if(v&&v.images){
  const keys=[];
  if(Array.isArray(v.audios)){
   for(const a of v.audios){if(a&&a.audioKey)keys.push(a.audioKey)}
  }
  for(const k of Object.keys(v.images)){if(!keys.includes(k))keys.push(k)}
  for(const k of keys){
   const val=v.images[k];
   if(!val)continue;
   if(val instanceof Uint8Array&&isAudioBytesHeader(val))return val;
   if(val instanceof ArrayBuffer){const u=new Uint8Array(val);if(isAudioBytesHeader(u))return u}
   if(typeof val==='string'){
    let b64=val;
    const comma=val.indexOf(',');
    if(comma>=0)b64=val.slice(comma+1);
    try{
     const bin=atob(b64.trim());
     if(bin.length>16){
      const u=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      if(isAudioBytesHeader(u)||(Array.isArray(v.audios)&&v.audios.some(a=>a&&a.audioKey===k)))return u;
     }
    }catch(e){}
   }
  }
 }
 // 2. Parse raw SVGA 2.0 zlib protobuf (field 3 = images map) or ZIP
 const u=rawU8||(it&&it.file?new Uint8Array(await it.file.arrayBuffer()):null);
 if(!u||u.length<8)return null;
 if(u[0]===0x50&&u[1]===0x4B&&window.JSZip){
  try{
   const z=await JSZip.loadAsync(u);
   for(const name of Object.keys(z.files)){
    if(/\.(mp3|wav|m4a|aac|ogg)$/i.test(name)){
     return new Uint8Array(await z.files[name].async('arraybuffer'));
    }
   }
  }catch(e){}
  return null;
 }
 if(typeof DecompressionStream==='function'){
  for(const fmt of ['deflate','deflate-raw']){
   try{
    const ds=new DecompressionStream(fmt);
    const w=ds.writable.getWriter();
    w.write(u);w.close();
    const inf=new Uint8Array(await new Response(ds.readable).arrayBuffer());
    let p=0;
    const rv=()=>{let r=0,s=0;while(p<inf.length){const b=inf[p++];r|=(b&127)<<s;if(!(b&128))return r;s+=7}return r};
    while(p<inf.length){
     const tag=rv(),fn=tag>>>3,wt=tag&7;
     if(wt===0){rv()}
     else if(wt===1){p+=8}
     else if(wt===5){p+=4}
     else if(wt===2){
      const len=rv(),end=p+len;
      if(fn===3&&end<=inf.length){
       let q=p,valBytes=null;
       const rv2=()=>{let r=0,s=0;while(q<end){const b=inf[q++];r|=(b&127)<<s;if(!(b&128))return r;s+=7}return r};
       while(q<end){
        const t2=rv2(),f2=t2>>>3,w2=t2&7;
        if(w2===2){
         const l2=rv2();
         if(f2===2&&q+l2<=end)valBytes=inf.subarray(q,q+l2);
         q+=l2;
        }else if(w2===0){rv2()}
        else if(w2===1){q+=8}
        else if(w2===5){q+=4}
        else break;
       }
       if(valBytes&&isAudioBytesHeader(valBytes))return valBytes.slice();
      }
      p=end;
     }else break;
    }
    break;
   }catch(e){}
  }
 }
 return null;
}

function getAudioEncoderCandidates(sourceSampleRate,sourceChannels){
 const ch=Math.min(2,Math.max(1,Math.round(sourceChannels||2)));
 const sr=Math.round(sourceSampleRate||48000);
 const list=[
  {codec:'mp4a.40.2',muxCodec:'aac',sampleRate:sr,numberOfChannels:ch,bitrate:160000}
 ];
 if(sr!==48000)list.push({codec:'mp4a.40.2',muxCodec:'aac',sampleRate:48000,numberOfChannels:ch,bitrate:160000});
 if(sr!==44100)list.push({codec:'mp4a.40.2',muxCodec:'aac',sampleRate:44100,numberOfChannels:ch,bitrate:160000});
 list.push({codec:'opus',muxCodec:'opus',sampleRate:48000,numberOfChannels:ch,bitrate:128000});
 if(ch!==2)list.push({codec:'opus',muxCodec:'opus',sampleRate:48000,numberOfChannels:2,bitrate:128000});
 return list;
}

function resampleChannel(input,srcRate,dstRate,dstLength,srcOffsetSamples){
 const out=new Float32Array(Math.max(0,dstLength));
 if(!input||!input.length||dstLength<=0)return out;
 const sRate=Math.max(1,srcRate||48000),dRate=Math.max(1,dstRate||48000);
 const ratio=sRate/dRate,maxIdx=input.length-1,off=srcOffsetSamples||0;
 if(Math.abs(ratio-1)<1e-6){
  for(let i=0;i<dstLength;i++){
   const idx=off+i;
   out[i]=(idx>=0&&idx<=maxIdx)?input[idx]:0;
  }
  return out;
 }
 for(let i=0;i<dstLength;i++){
  const pos=off+i*ratio;
  if(pos<0||pos>maxIdx){out[i]=0;continue}
  const i0=Math.floor(pos),i1=Math.min(maxIdx,i0+1),f=pos-i0;
  out[i]=input[i0]*(1-f)+input[i1]*f;
 }
 return out;
}

async function decodeItemAudioBuffer(it){
 if(!it||!it.file)return null;
 if(it._audioBuf)return it._audioBuf;
 if(it.fmt!=='mp4'&&it.fmt!=='vap'&&it.fmt!=='svga')return null;
 const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!OAC&&!AC)return null;
 let rawBytes=null;
 try{
  if(it.fmt==='svga'){
   rawBytes=await extractSvgaAudioBytes(it);
  }else{
   let u=new Uint8Array(await it.file.arrayBuffer());
   // Strip any custom prefix before ftyp box so decodeAudioData sees a valid MP4 container
   for(let i=4;i<Math.min(u.length-4,65536);i++){
    if(u[i]===0x66&&u[i+1]===0x74&&u[i+2]===0x79&&u[i+3]===0x70){
     if(i>4)u=u.subarray(i-4);
     break;
    }
   }
   rawBytes=u;
  }
 }catch(e){}
 if(!rawBytes||rawBytes.byteLength<16)return null;

 // Decode at 48000 Hz stereo via OfflineAudioContext so both AAC and Opus encoders work without pitch drift
 const ctx=OAC?new OAC(2,48000,48000):new AC();
 try{
  const ab=rawBytes.buffer.slice(rawBytes.byteOffset,rawBytes.byteOffset+rawBytes.byteLength);
  const buf=await Promise.race([
   ctx.decodeAudioData(ab).catch(()=>null),
   new Promise(r=>setTimeout(()=>r(null),4000))
  ]);
  if(buf&&buf.length>0){
   it._audioBuf=buf;
   it.audio=true;
   return buf;
  }
  return null;
 }catch(e){
  return null;
 }finally{
  if(!OAC&&ctx&&typeof ctx.close==='function'){
   try{ctx.close().catch(N)}catch(e){}
  }
 }
}

async function recordWebCodecsMP4(list,W,H,reqFps,prog,poster){

 if(layout){W=layout.canvasWidth;H=layout.canvasHeight}
 W=Math.max(64,(W+1)&~1);

 for(const codec of getOptimalAvcCodecs(W,H)){

 const target=new MuxerLib.ArrayBufferTarget();

 let encErr=null;

 ve.configure(encConfig);

 const cvs=[E('canvas'),E('canvas')];
 cvs[0].width=cvs[1].width=W;
 cvs[0].height=cvs[1].height=H;

 let posterCv=null;

 document.body.append(root);
 let globalFrameIdx=0;
 const maxDur=Math.max(0.2,...list.map(o=>o.dur||3));

 try{
  if(isSideBySide&&layout){
   // عرض وتصدير جميع الهدايا جنب بعض في نفس الوقت داخل فيديو واحد
   $('#dt').textContent=`ترتيب وتجهيز ${list.length} هدايا جنب بعض في فيديو واحد…`;
   const slots=[];
   for(let i=0;i<list.length;i++){
    if(sig.stop||encErr)break;
    const o=list[i],cell=layout.cells[i];

   const posterFrame=Math.min(totalFrames-1,Math.max(0,Math.floor(totalFrames*0.45)));

   try{

     try{s.P.destroy()}catch(e){}

    if(P.stepTo)await P.stepTo(sec);

    const vf=new VideoFrame(curCv,{timestamp:ts,duration:nextTs-ts});
    try{
     ve.encode(vf,{keyFrame:globalFrameIdx%Math.max(1,Math.round(safeFps))===0});
    }finally{
     vf.close();

    globalFrameIdx++;

    const waitStart=performance.now();
    while(ve.encodeQueueSize>2&&!sig.stop&&!encErr&&performance.now()-waitStart<8000){
     await new Promise(r=>setTimeout(r,2));
    }
    await new Promise(r=>setTimeout(r,0));
    prog(Math.min(1,(fIdx+1)/totalFrames));

}

 const cv=E('canvas');cv.width=W;cv.height=H;
 const cx=cv.getContext('2d',{alpha:false});

function scanTightAlphaBounds(rgba,w,h,alphaThreshold){
 const th=alphaThreshold||16;
 let minX=w,minY=h,maxX=-1,maxY=-1,visiblePixels=0,clarityScore=0;
 for(let y=0;y<h;y++){
  const rowOff=y*w*4;
  for(let x=0;x<w;x++){
   const idx=rowOff+x*4;
   const a=rgba[idx+3];
   if(a>th){
    if(x<minX)minX=x;
    if(x>maxX)maxX=x;
    if(y<minY)minY=y;
    if(y>maxY)maxY=y;
    visiblePixels++;
    const luma=0.299*rgba[idx]+0.587*rgba[idx+1]+0.114*rgba[idx+2];
    clarityScore+=(a/255)*(0.4+0.6*(luma/255));
   }
  }
 }
 if(maxX<minX||maxY<minY||visiblePixels===0)return null;
 return{minX,minY,maxX,maxY,width:maxX-minX+1,height:maxY-minY+1,visiblePixels,clarityScore};
}

async function snapBlob(it,W,H){
 const outW=Math.max(512,(W||720)&~1),outH=Math.max(512,(H||720)&~1);
 const stageW=Math.max(720,outW),stageH=Math.max(720,outH);
 const root=E('div');
 root.style.cssText=`position:fixed;left:0;top:0;width:${stageW}px;height:${stageH}px;pointer-events:none;opacity:0.002;z-index:-1;overflow:hidden`;
 document.body.append(root);
 const h=E('div');h.style.cssText=`position:absolute;inset:0;width:${stageW}px;height:${stageH}px;display:flex`;root.append(h);let P;
 try{
  P=await mkPlayer(it,h,{loop:false,hiRes:true,manual:true});
  if(P.waitReady)await P.waitReady();
  const d0=Math.max(0.4,dur(it));
  const candidateTimes=P.stepTo?[
   Math.min(d0*0.48,d0-0.04),
   Math.min(d0*0.62,d0-0.04),
   Math.min(d0*0.34,d0-0.04),
   Math.min(d0*0.76,d0-0.04)
  ]:[Math.min(d0*0.5,1.5)];

  let bestCv=null,bestBounds=null;
  for(const t of candidateTimes){
   const safeT=Math.max(0.05,t);
   if(P.stepTo)await P.stepTo(safeT);
   else{P.restart();await new Promise(r=>setTimeout(r,safeT*1000+180));P.syncNow&&P.syncNow()}
   P.syncNow&&P.syncNow();
   const tmpCv=E('canvas');tmpCv.width=stageW;tmpCv.height=stageH;
   const tmpCx=tmpCv.getContext('2d',{willReadFrequently:true});
   fit(tmpCx,P.src(),stageW,stageH,it);
   try{
    const imgData=tmpCx.getImageData(0,0,stageW,stageH);
    const bnd=scanTightAlphaBounds(imgData.data,stageW,stageH,16);
    if(bnd&&(!bestBounds||bnd.clarityScore>bestBounds.clarityScore)){
     bestBounds=bnd;
     bestCv=tmpCv;
    }else if(!bestCv){
     bestCv=tmpCv;
    }
   }catch(e){
    if(!bestCv)bestCv=tmpCv;
   }
  }

  const cv=E('canvas');cv.width=outW;cv.height=outH;
  const cx=cv.getContext('2d');
  cx.clearRect(0,0,outW,outH);
  cx.imageSmoothingEnabled=true;
  cx.imageSmoothingQuality='high';
  // خلفية شفافة 100% دائماً وبدون أي علامة مائية أو إضافات على الصور المستخرجة
  if(bestCv&&bestBounds&&bestBounds.width>=8&&bestBounds.height>=8){
   // قص وتكبير الهدية بدقة عالية على قد الصورة تماماً مع هامش متناسق 3%
   const pad=0.03;
   const availW=Math.max(1,outW*(1-pad*2)),availH=Math.max(1,outH*(1-pad*2));
   const scale=Math.min(availW/bestBounds.width,availH/bestBounds.height);
   const dw=Math.max(1,Math.round(bestBounds.width*scale));
   const dh=Math.max(1,Math.round(bestBounds.height*scale));
   const dx=Math.round((outW-dw)/2),dy=Math.round((outH-dh)/2);
   cx.drawImage(bestCv,bestBounds.minX,bestBounds.minY,bestBounds.width,bestBounds.height,dx,dy,dw,dh);
  }else if(bestCv){
   cx.drawImage(bestCv,0,0,outW,outH);
  }else{
   fit(cx,P.src(),outW,outH,it);
  }
  return await new Promise(r=>cv.toBlob(r,'image/png'));
 }finally{P&&P.destroy();root.remove()}
}

}

 const notifyCapture=(reason)=>{
  try{
   if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText('').catch(N);
  }catch(e){}
  try{
   window.parent&&window.parent.postMessage({type:'MOTIONTOOLS_SCREEN_CAPTURE_DETECTED',reason:reason||'capture'},'*');
  }catch(e){}
 };

 addEventListener('contextmenu',e=>{
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
  e.preventDefault();
 },{capture:true});

 addEventListener('keydown',e=>{
  const k=(e.key||'').toLowerCase();
  if(e.key==='F12'||e.keyCode===123||((e.ctrlKey||e.metaKey)&&e.shiftKey&&['i','j','c'].includes(k))||((e.ctrlKey||e.metaKey)&&['u','s','p'].includes(k))){
   e.preventDefault();e.stopPropagation();return false;
  }
  if(
   e.key==='PrintScreen'||e.code==='PrintScreen'||e.keyCode===44||k==='snapshot'||
   ((e.metaKey||e.ctrlKey)&&e.shiftKey&&['3','4','5','s','r'].includes(k))||
   (e.metaKey&&e.altKey&&k==='r')||
   (e.metaKey&&!e.ctrlKey&&!e.shiftKey&&k==='g')
  ){
   e.preventDefault();e.stopPropagation();
   notifyCapture('shortcut');
   return false;
  }
 },{capture:true});

 addEventListener('keyup',e=>{
  if(e.key==='PrintScreen'||e.code==='PrintScreen'||e.keyCode===44){
   e.preventDefault();e.stopPropagation();
   notifyCapture('printscreen');
  }
 },{capture:true});

 if(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia){
  navigator.mediaDevices.getDisplayMedia=async()=>{
   notifyCapture('getDisplayMedia');
   throw new Error('🚫 يمنع تصوير الشاشة أو تسجيل الفيديو داخل المنصة.');
  };
 }
