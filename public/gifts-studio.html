<style>
:root{--bg:#0b0e1a;--sf:#141930;--tx:#eceefa;--mu:#8991b0;--bd:#252c4d;--ac:#8a70ff;--ac2:#b24cff;--er:#e0334f;--ok:#12a36a;--sh:0 8px 30px #0008;--bgv:#141a30;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root[data-theme="light"]{--bg:#f4f5fb;--sf:#fff;--tx:#161a2e;--mu:#737a95;--bd:#e1e4f0;--ac:#6a4cff;--ac2:#b24cff;--er:#e0334f;--ok:#12a36a;--sh:0 8px 30px #1b1f4a14}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}

button,select,input{font:inherit;color:inherit}

button:hover{border-color:var(--ac);transform:translateY(-1px)}button:disabled{opacity:.5;pointer-events:none}
button.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;font-weight:600;box-shadow:0 6px 18px #6a4cff44}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 18px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.brand{display:flex;gap:10px;align-items:center;margin-inline-end:auto}.lg{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-size:20px;font-style:normal}
.brand b{display:block;font-size:16px}.brand small{color:var(--mu)}
.act{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:relative}
.pop{position:absolute;top:110%;inset-inline-start:0;z-index:30;width:270px;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--sh);display:none;flex-direction:column;gap:10px}.pop.o{display:flex}
.sw{display:flex;flex-wrap:wrap;gap:8px}.sw i{width:34px;height:34px;border-radius:10px;cursor:pointer;border:2px solid var(--bd)}.sw i:hover{border-color:var(--ac)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 18px;color:var(--mu)}
.bar button{padding:6px 10px;font-size:13px}.bar .sp{margin-inline-end:auto}

#drop h2{color:var(--tx);margin:8px 0}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--w,200px),1fr));gap:14px;padding:6px 18px 110px}

.st{aspect-ratio:1;background:var(--bgv);display:flex;align-items:center;justify-content:center;overflow:hidden}.st>div{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative}.st>div>*{max-width:100%;max-height:100%}
.st canvas{max-width:100%!important;max-height:100%!important;width:100%!important;height:100%!important;object-fit:contain!important;transform:none!important;margin:0!important}
.st .er{color:var(--er);padding:10px;text-align:center;font-size:12px}
.tag{position:absolute;top:8px;inset-inline-start:8px;background:#000a;color:#fff;border-radius:8px;padding:2px 8px;font-size:11px;z-index:2}
.ck{position:absolute;top:8px;inset-inline-end:8px;width:20px;height:20px;accent-color:var(--ac);z-index:2}

.cb{display:flex;flex-wrap:wrap;gap:6px;padding:4px 12px 12px}.meta select{width:100%;margin-top:6px;padding:4px 8px;font-size:12px}.cb button{padding:4px 8px;border-radius:9px}

#pw{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}#pg{height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .2s}
.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}label{display:inline-flex;gap:6px;align-items:center}

 <div class="brand"><i class="lg">🎁</i><div><b>استوديو الهدايا</b><small>شغّل وصدّر كل صيغ الهدايا</small></div></div>
 <div class="act">

  <button id="bgb">🖼 الخلفية</button><button id="pwb" title="اختر ملف libpag.wasm">⚙ محرك PAG</button><input type="file" id="pwi" accept=".wasm" hidden>
  <div class="pop" id="pop">
   <div class="sw" id="sw"></div>
   <div class="r"><input type="color" id="c1" value="#141a30"><input type="color" id="c2" value="#4b2f8a"><select id="bm"><option value="color">لون</option><option value="grad">تدرّج</option><option value="img">صورة</option><option value="tr">شفافة</option></select></div>
   <div class="r"><button id="bi">رفع صورة خلفية</button><select id="bf"><option value="cover">تغطية</option><option value="contain">احتواء</option><option value="fill">تمديد</option></select></div>

<div id="drop"><div style="font-size:46px">📦</div><h2>اسحب الهدايا هنا أو اضغط للرفع</h2><div>SVGA · PAG · VAP · Lottie · MP4 · GIF · APNG · WebP · SVG</div><div style="font-size:12px;opacity:.7;margin-top:6px">لا يتم رفع الصور الثابتة (PNG / JPG)</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/svgaplayerweb/2.3.1/svga.min.js"></script>

<script>
const $=s=>document.querySelector(s),E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L=u=>new TextDecoder('latin1').decode(u),S=(u,a,b)=>L(u.subarray(a,b)),N=()=>{};
const MIME={svg:'image/svg+xml',mp4:'video/mp4',vap:'video/mp4',gif:'image/gif',png:'image/png',apng:'image/png',webp:'image/webp',webpa:'image/webp',jpg:'image/jpeg'};
const NAMES={svga:'SVGA',lottie:'Lottie',gif:'GIF',apng:'APNG',webpa:'WebP',webp:'WebP',png:'PNG',jpg:'JPG',svg:'SVG',mp4:'MP4',vap:'VAP',pag:'PAG'};
let items=[],nid=1,muted=true,playing=true,players=new Map(),sig={stop:false},out=null,dl=null,dragId=0;
const bg={mode:'color',c1:'#141a30',c2:'#4b2f8a',img:null,url:'',fit:'cover'};
const dur=it=>it.dur>0?it.dur:+$('#sd').value||3;

/* محرك WebGL المشترك لتسريع شفافية فيديوهات الهدايا (VAP / YYEVA / Alpha MP4) بدون أي لاج */
let _gl=null;
function getAlphaGL(){
 if(_gl!==null)return _gl;
 try{
  const cv=E('canvas'),gl=cv.getContext('webgl',{alpha:true,premultipliedAlpha:false,antialias:false,depth:false,stencil:false,preserveDrawingBuffer:true});
  if(!gl)return(_gl=false);
  const vs=gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs,'attribute vec2 p;varying vec2 u;void main(){u=p;gl_Position=vec4(p.x*2.0-1.0,1.0-p.y*2.0,0.0,1.0);}');
  gl.compileShader(vs);
  const fs=gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs,'precision mediump float;varying vec2 u;uniform sampler2D t;uniform vec4 cR;uniform vec4 aR;void main(){vec4 c=texture2D(t,cR.xy+u*cR.zw);float a=texture2D(t,aR.xy+u*aR.zw).r;vec3 rgb=(a>0.004&&a<0.996)?clamp(c.rgb/a,0.0,1.0):c.rgb;gl_FragColor=vec4(rgb,a);}');
  gl.compileShader(fs);
  const pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return(_gl=false);
  gl.useProgram(pr);
  const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0,1,0,0,1,0,1,1,0,1,1]),gl.STATIC_DRAW);
  const pl=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(pl);gl.vertexAttribPointer(pl,2,gl.FLOAT,false,0,0);
  const tx=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tx);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  _gl={cv,gl,tx,uC:gl.getUniformLocation(pr,'cR'),uA:gl.getUniformLocation(pr,'aR')};
 }catch(e){_gl=false}
 return _gl;
}
function drawAlphaFrame(v,rx,ry,rw,rh,ax,ay,aw,ah,cx,dw,dh,tmp){
 const vw=v.videoWidth,vh=v.videoHeight;if(!vw||!vh)return;
 const g=getAlphaGL();
 if(g&&!g.gl.isContextLost()){
  const {cv,gl,tx,uC,uA}=g;
  if(cv.width!=dw||cv.height!=dh){cv.width=dw;cv.height=dh;gl.viewport(0,0,dw,dh)}
  gl.bindTexture(gl.TEXTURE_2D,tx);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,v);
  gl.uniform4f(uC,rx/vw,ry/vh,rw/vw,rh/vh);
  gl.uniform4f(uA,ax/vw,ay/vh,aw/vw,ah/vh);
  gl.drawArrays(gl.TRIANGLES,0,6);
  cx.clearRect(0,0,dw,dh);
  cx.drawImage(cv,0,0,dw,dh);
  return;
 }
 cx.drawImage(v,rx,ry,rw,rh,0,0,dw,dh);
 tmp.tx.drawImage(v,ax,ay,aw,ah,0,0,dw,dh);
 const a=cx.getImageData(0,0,dw,dh),d=a.data,m=tmp.tx.getImageData(0,0,dw,dh).data;
 for(let k=0;k<d.length;k+=4){const al=m[k];if(al>0&&al<255){const q=255/al;d[k]*=q;d[k+1]*=q;d[k+2]*=q}d[k+3]=al}
 cx.putImageData(a,0,0);
}

/* حلقة التحديث الموحدة لجميع مشغلات الفيديو الشفافة لمنع التقطيع واللاج */
const alphaTasks=new Set();
(function masterTick(){
 const now=performance.now();
 alphaTasks.forEach(tk=>{
  if(!tk.cv.isConnected)return;
  if(!tk.hiRes&&tk.it&&tk.it.vis===false&&tk.drawn)return;
  const v=tk.v;
  if(v.readyState>1){
   const vt=v.currentTime;
   if(!tk.drawn||(Math.abs(vt-tk.lastT)>0.008&&(tk.hiRes||now-tk.lastNow>=28))){
    tk.lastT=vt;tk.lastNow=now;tk.drawn=true;
    const [rx,ry,rw,rh]=tk.c,[ax,ay,aw,ah]=tk.a;
    drawAlphaFrame(v,rx,ry,rw,rh,ax,ay,aw,ah,tk.cx,tk.dw,tk.dh,tk.tmp);
   }
  }
 });
 requestAnimationFrame(masterTick);
})();

/* كشف الصيغة من المحتوى */
function pngInfo(u){const dv=new DataView(u.buffer,u.byteOffset);let i=8,ac=0,t=0;while(i+12<=u.length){const l=dv.getUint32(i),ty=S(u,i+4,i+8);if(ty=='acTL')ac=1;if(ty=='fcTL')t+=dv.getUint16(i+28)/(dv.getUint16(i+30)||100);if(ty=='IDAT'&&!ac)break;i+=12+l}return{ac,t}}
function gifDur(u){let s=0;for(let i=0;i<u.length-6;i++)if(u[i]==0x21&&u[i+1]==0xF9&&u[i+2]==4){const d=u[i+4]|u[i+5]<<8;s+=d<2?10:d}return s/100}
function webpDur(u){let i=12,s=0;while(i+8<=u.length){const ty=S(u,i,i+4),sz=u[i+4]|u[i+5]<<8|u[i+6]<<16|u[i+7]<<24;if(ty=='ANMF')s+=u[i+20]|u[i+21]<<8|u[i+22]<<16;i+=8+sz+(sz&1)}return s/1000}
function sniff(u){
 if(u[0]==0x89&&S(u,1,4)=='PNG')return pngInfo(u).ac?'apng':'png';
 if(u[0]==0xFF&&u[1]==0xD8)return'jpg';
 if(S(u,0,4)=='GIF8')return'gif';
 if(S(u,0,4)=='RIFF'&&S(u,8,12)=='WEBP')return L(u.subarray(12,Math.min(u.length,400))).includes('ANIM')?'webpa':'webp';
 if(S(u,4,8)=='ftyp')return'mp4';
 if(S(u,0,3)=='PAG')return'pag';
 if(u[0]==0x78||S(u,0,2)=='PK')return'svga';
 if(u.length<3e7){const t=new TextDecoder().decode(u).trim();
  if(t[0]=='<'&&t.includes('<svg'))return'svg';
  if(t[0]=='{'){try{const j=JSON.parse(t);if(j.layers&&j.fr)return'lottie'}catch(e){}}}
 return null}
const imgDims=url=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res([i.naturalWidth,i.naturalHeight]);i.onerror=()=>rej(Error('ملف تالف'));i.src=url});
function vapInfo(T){const k=T.indexOf('vapc');if(k<0)return null;let s=T.indexOf('{',k),d=0,e=s;for(;e<T.length;e++){if(T[e]=='{')d++;if(T[e]=='}'&&--d==0)break}try{const i=JSON.parse(T.slice(s,e+1)).info;return i&&i.rgbFrame&&i.aFrame?i:null}catch(x){return null}}
function yyevaInfo(T){
 for(const tag of ['yyev','yyeffectmp4json']){
  const k=T.indexOf(tag);if(k<0)continue;
  let s=T.indexOf('{',k);if(s<0||s-k>400)continue;
  let d=0,e=s;for(;e<T.length;e++){if(T[e]=='{')d++;if(T[e]=='}'&&--d==0)break}
  try{const j=JSON.parse(T.slice(s,e+1)),desc=j.descript||j.info||j;if(desc&&desc.rgbFrame&&(desc.alphaFrame||desc.aFrame))return{rgbFrame:desc.rgbFrame,aFrame:desc.alphaFrame||desc.aFrame}}catch(x){}
 }
 return null;
}
const lay=(l,W,H)=>{const w=W>>1,h=H>>1;return{a:l=='L'?[0,0,w,H]:l=='R'?[w,0,w,H]:l=='T'?[0,0,W,h]:[0,h,W,h],c:l=='L'?[w,0,w,H]:l=='R'?[0,0,w,H]:l=='T'?[0,h,W,h]:[0,0,W,h]}};
function setAlpha(it,l){it.alpha=l;if(l=='N'||!it.vw){it.rects=null;it.w=it.vw;it.h=it.vh;return}it.rects=lay(l,it.vw,it.vh);it.w=it.rects.c[2];it.h=it.rects.c[3]}
const alSel=it=>it.fmt!='mp4'||!it.vw?'':'<select data-al="1">'+[['N','بدون قناة ألفا'],['L','ألفا: يسار'],['R','ألفا: يمين'],['T','ألفا: أعلى'],['B','ألفا: أسفل']].map(([v,t])=>`<option value="${v}" ${(it.alpha||'N')==v?'selected':''}>${t}</option>`).join('')+'</select>';
function evalL(d,cw,ch,l){const r=lay(l,cw,ch),[ax,ay,aw,ah]=r.a,[cx,cy]=r.c;let na=0,ga=0,nc=0,gc=0,i=0,u=0;
 for(let y=0;y<ah;y+=2)for(let x=0;x<aw;x+=2){const p=((ay+y)*cw+ax+x)*4,q=((cy+y)*cw+cx+x)*4,A=(d[p]+d[p+1]+d[p+2])/3>24,C=(d[q]+d[q+1]+d[q+2])/3>24;
  if(A){na++;if(Math.abs(d[p]-d[p+1])<14&&Math.abs(d[p+1]-d[p+2])<14)ga++}
  if(C){nc++;if(Math.abs(d[q]-d[q+1])<14&&Math.abs(d[q+1]-d[q+2])<14)gc++}
  if(A&&C)i++;if(A||C)u++}
 return{na,ga:na?ga/na:0,gc:nc?gc/nc:1,iou:u?i/u:0}}
async function detectAlpha(v){
 const k=Math.min(1,160/v.videoWidth),cw=Math.max(2,Math.round(v.videoWidth*k)&~1),ch=Math.max(2,Math.round(v.videoHeight*k)&~1),c=E('canvas');c.width=cw;c.height=ch;
 const x=c.getContext('2d',{willReadFrequently:true}),sc={L:0,R:0,T:0,B:0},n={L:0,R:0,T:0,B:0},bad={};
 for(const p of [.25,.6]){await new Promise(r=>{v.onseeked=r;v.currentTime=(v.duration||1)*p;setTimeout(r,350)});x.drawImage(v,0,0,cw,ch);const d=x.getImageData(0,0,cw,ch).data;
  for(const l in sc){const e=evalL(d,cw,ch,l);if(e.na<cw*ch*.0005)continue;n[l]++;if(e.iou<.3||e.ga<.9)bad[l]=1;sc[l]+=e.ga-e.gc}}
 let best=null,bs=.12;for(const l in sc)if(!bad[l]&&n[l]&&sc[l]/n[l]>=bs){bs=sc[l]/n[l];best=l}return best}
async function analyze(it){
 try{
  const u=new Uint8Array(await it.file.arrayBuffer());let f=sniff(u);
  if(!f)throw Error('صيغة غير معروفة أو ملف تالف');
  if(f=='png'||f=='jpg'||f=='webp'){it.rej=1;return}
  if(f=='mp4'){const T=L(u.subarray(0,Math.min(u.length,2e6)))+(u.length>2e6?L(u.subarray(Math.max(2e6,u.length-2e6))):'');it.audio=T.includes('soun');it.vapi=vapInfo(T);it.yyi=yyevaInfo(T);it.yy=!!(it.yyi||T.includes('yyeffectmp4json')||T.includes('yyev'))}
  it.fmt=f;it.url=URL.createObjectURL(new Blob([u],{type:MIME[f]||''}));

  const cv=E('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d');fit(cx,P.src(),W,H,it);
  return await new Promise(r=>cv.toBlob(r,'image/png'))}finally{P&&P.destroy();root.remove()}}
async function save(name,blob){
 const ds=$('#ds');
 /* 1) قدرة التنزيل داخل claude.ai */
 try{dl=dl||(window.claude?await claude.use('downloads'):null)}catch(e){}
 if(dl){try{await dl.save({filename:name,data:new Uint8Array(await blob.arrayBuffer())});return}catch(e){if(e.code=='declined')return}}
 /* 2) بديل: تنزيل مباشر عبر المتصفح (يعمل عند فتح الملف محليًا) */
 try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);ds.textContent='تم بدء التنزيل: '+name}
 catch(e){ds.textContent='تعذر الحفظ: '+(e.message||e)}}
$('#cx').onclick=()=>{sig.stop=true;$('#dock').style.display='none'};$('#sv').onclick=()=>out&&save(out.name,out.blob);
$('#ex').onclick=async()=>{
 const ok=items.filter(i=>!i.err&&i.fmt),sel=ok.filter(i=>i.sel),list=sel.length?sel:ok;
 if(!list.length)return;if(!window.MediaRecorder)return alert('المتصفح لا يدعم التسجيل');
 sig={stop:false};out=null;const mode=$('#mode').value,H0=+$('#q').value,fps=+$('#fps').value,mt=pickMime(list.some(i=>i.audio));
 const sz=it=>{const h=Math.min(2160,Math.max(2,Math.round((H0||it.h||720)/2)*2)),w=Math.min(4096,Math.max(2,Math.round(h*((it.w/it.h)||1)/2)*2));return[w,h]};
 $('#dock').style.display='block';$('#sv').style.display='none';$('#cx').style.display='';$('#ex').disabled=true;
 const pg=v=>$('#pg').style.width=Math.min(100,v*100)+'%',ds=$('#ds');ds.textContent=mt.ext=='mp4'?'أبقِ التبويب ظاهرًا أثناء التسجيل':'متصفحك لا يسجّل MP4 مباشرة فسيكون الناتج WebM';
 try{
  if(mode=='gift'||mode=='img'||mode=='gi'){const ent=[],used=new Set();let d=0;
   for(const it of list){if(sig.stop)break;$('#dt').textContent=`(${d+1}/${list.length}) ${it.name}`;
    const m=it.name.match(/\.[^.]+$/),ext=m?m[0]:'';let base=it.name.replace(/\.[^.]+$/,''),k=base,n=1;while(used.has(k))k=base+'_'+ ++n;used.add(k);
    if(mode!='img')ent.push([k+ext,it.file]);
    if(mode!='gift'){try{const [W,H]=sz(it),b=await snapBlob(it,W,H);if(b)ent.push([k+'.png',b])}catch(e){ds.textContent='فشلت صورة: '+it.name}}
    d++;pg(d/list.length)}
   if(!sig.stop&&ent.length){if(ent.length==1)out={name:ent[0][0],blob:ent[0][1]};
    else{$('#dt').textContent='جارٍ تجهيز الملف…';const z=new JSZip();ent.forEach(([a,b])=>z.file(a,b));out={name:(mode=='gift'?'gifts-files':mode=='img'?'gifts-images':'gifts-files-images')+'.zip',blob:await z.generateAsync({type:'blob'})}}}}
  else if(mode=='one'){$('#dt').textContent='جارٍ إنشاء الفيديو…';const [W,H]=sz(list[0]);
   const b=await record(list.map(it=>({it,dur:dur(it)})),W,H,fps,mt,pg);if(!sig.stop)out={name:'gifts.'+mt.ext,blob:b}}
  else{const z=new JSZip(),used=new Set();let d=0;
   for(const it of list){if(sig.stop)break;$('#dt').textContent=`(${d+1}/${list.length}) ${it.name}`;
    const [W,H]=sz(it),po={};let b;
    try{b=await record([{it,dur:dur(it)}],W,H,fps,mt,v=>pg((d+v)/list.length),po)}catch(e){ds.textContent='فشل: '+it.name+' — '+(e.message||e);d++;continue}
    if(sig.stop)break;
    let base=it.name.replace(/\.[^.]+$/,''),k=base,n=1;while(used.has(k))k=base+'_'+ ++n;used.add(k);
    if(mode=='pack'){z.file(k+'/'+k+'.'+mt.ext,b);try{const pb=await snapBlob(it,W,H);if(pb)z.file(k+'/'+k+'.png',pb)}catch(e){}z.file(k+'/'+it.name,it.file)}else{z.file(k+'.'+mt.ext,b);window.__lv={name:k+'.'+mt.ext,blob:b}}
    d++;pg(d/list.length)}
   if(!sig.stop&&mode=='sep'&&list.length==1&&window.__lv)out=window.__lv;else if(!sig.stop){$('#dt').textContent='جارٍ تجهيز الملف…';out={name:(mode=='pack'?'gifts-pack':'gifts-videos')+'.zip',blob:await z.generateAsync({type:'blob'})}}}
 }catch(e){ds.textContent='خطأ: '+(e.message||e)}
 $('#ex').disabled=false;
 if(out){pg(1);$('#dt').textContent='اكتمل ✓ ('+(out.blob.size/1048576).toFixed(1)+' MB)';$('#sv').style.display='';$('#cx').style.display='none'}else if(!sig.stop)$('#dt').textContent='لم يكتمل التصدير'};
